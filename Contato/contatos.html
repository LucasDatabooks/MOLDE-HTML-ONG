<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contato</title>
  <link rel="stylesheet" href="contato.css">
</head>
<body>
  <section class="contato">
    <h1>Fale conosco</h1>

    <div class="resumo" id="resumo-erros" role="alert"></div>

    <form id="form-contato" novalidate>
      <div class="campo">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome">
        <div class="erro" id="erro-nome"></div>
      </div>

      <div class="campo">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="seunome@email.com">
        <div class="erro" id="erro-email"></div>
      </div>

      <div class="campo">
        <label for="assunto">Assunto</label>
        <textarea id="assunto" name="assunto" rows="4"></textarea>
        <div class="erro" id="erro-assunto"></div>
      </div>

      <button type="submit">Enviar</button>
      <div class="sucesso" id="mensagem-sucesso"></div>
    </form>
  </section>

  <script src="script.js"></script>
</body>
</html>
